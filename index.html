<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BGS Pocket Scripture</title>

    <!-- App Name & Theme Settings -->
    <meta name="application-name" content="BGS Pocket Scripture">
    <meta name="apple-mobile-web-app-title" content="BGS Pocket Scripture">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4f46e5">

    <!-- Direct Favicon & Mobile Web Clip Icons -->
    <link rel="icon" type="image/png" sizes="512x512" href="https://bgscribn.github.io/Pocket-Bible/icon.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="https://bgscribn.github.io/Pocket-Bible/icon.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="https://bgscribn.github.io/Pocket-Bible/icon.png?v=2">

    <!-- Static Web App Manifest Link -->
    <link rel="manifest" href="manifest.json">

    <!-- Dynamic Web App Manifest Generation -->
    <script>
        (function() {
            const manifest = {
                "name": "BGS Pocket Scripture",
                "short_name": "BGS Scripture",
                "start_url": "https://bgscribn.github.io/Pocket-Bible/",
                "scope": "https://bgscribn.github.io/Pocket-Bible/",
                "display": "standalone",
                "orientation": "portrait",
                "background_color": "#ffffff",
                "theme_color": "#4f46e5",
                "icons": [
                    {
                        "src": "https://bgscribn.github.io/Pocket-Bible/icon.png?v=2",
                        "sizes": "192x192",
                        "type": "image/png",
                        "purpose": "any maskable"
                    },
                    {
                        "src": "https://bgscribn.github.io/Pocket-Bible/icon.png?v=2",
                        "sizes": "512x512",
                        "type": "image/png",
                        "purpose": "any maskable"
                    }
                ]
            };
            const stringManifest = JSON.stringify(manifest);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(blob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestURL;
            document.getElementsByTagName('head')[0].appendChild(link);
        })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Newsreader', 'serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        },
                        accent: {
                            500: '#10b981',
                            600: '#059669',
                        },
                        sepia: {
                            bg: '#f4f1ea',
                            card: '#e8e2d5',
                            text: '#2c251e',
                            border: '#dcd3c1'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --app-height: 100dvh;
            --ios-bottom-offset: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            height: 100%;
            height: -webkit-fill-available;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        .selectable-text {
            -webkit-user-select: text;
            user-select: text;
        }

        .font-scripture { font-family: 'Newsreader', serif; }

        .red-letter { color: #e11d48; }
        .dark .red-letter { color: #fb7185; }
        .sepia .red-letter { color: #9f1239; }

        .hl-yellow { background-color: rgba(253, 224, 71, 0.5); border-radius: 6px; }
        .hl-green  { background-color: rgba(110, 231, 183, 0.5); border-radius: 6px; }
        .hl-blue   { background-color: rgba(147, 197, 253, 0.5); border-radius: 6px; }
        .hl-pink   { background-color: rgba(249, 168, 212, 0.5); border-radius: 6px; }

        .dark .hl-yellow { background-color: rgba(161, 98, 7, 0.4); }
        .dark .hl-green  { background-color: rgba(6, 95, 70, 0.4); }
        .dark .hl-blue   { background-color: rgba(30, 58, 138, 0.4); }
        .dark .hl-pink   { background-color: rgba(131, 24, 67, 0.4); }

        body.sepia {
            background-color: #f4f1ea;
            color: #2c251e;
        }
        body.sepia .bg-card-theme { background-color: #e8e2d5; }
        body.sepia .border-theme { border-color: #dcd3c1; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .smooth-scroll {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        .header-safe {
            padding-top: max(12px, env(safe-area-inset-top));
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
        }

        .nav-safe {
            padding-bottom: max(12px, var(--ios-bottom-offset));
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
        }

        #multi-verse-dock {
            bottom: calc(4.25rem + var(--ios-bottom-offset));
        }

        #floating-chap-nav {
            bottom: calc(8.5rem + var(--ios-bottom-offset));
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in { animation: fadeInScale 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .page-flip-container {
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        .animate-flip-next-out { animation: flipOutLeft 0.22s ease-in forwards; transform-origin: left center; }
        .animate-flip-next-in  { animation: flipInRight 0.22s ease-out forwards; transform-origin: right center; }
        .animate-flip-prev-out { animation: flipOutRight 0.22s ease-in forwards; transform-origin: right center; }
        .animate-flip-prev-in  { animation: flipInLeft 0.22s ease-out forwards; transform-origin: left center; }

        @keyframes flipOutLeft { 0% { transform: rotateY(0deg); opacity: 1; } 100% { transform: rotateY(-35deg) translateX(-30px); opacity: 0; } }
        @keyframes flipInRight { 0% { transform: rotateY(35deg) translateX(30px); opacity: 0; } 100% { transform: rotateY(0deg) translateX(0); opacity: 1; } }
        @keyframes flipOutRight { 0% { transform: rotateY(0deg); opacity: 1; } 100% { transform: rotateY(35deg) translateX(30px); opacity: 0; } }
        @keyframes flipInLeft { 0% { transform: rotateY(-35deg) translateX(-30px); opacity: 0; } 100% { transform: rotateY(0deg) translateX(0); opacity: 1; } }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200 antialiased selection:bg-brand-500/30 text-base">

    <div id="app" class="flex flex-col h-full w-full max-w-md mx-auto bg-white dark:bg-slate-950 shadow-2xl relative overflow-hidden">
        
        <!-- HEADER WITH DYNAMIC SAFE-AREA SPACING -->
        <header id="header" class="relative z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800 transition-colors header-safe">
            <div class="flex items-center justify-between pb-3 pt-1">
                <div class="flex items-center space-x-2">
                    <button id="btn-nav-picker" class="flex items-center space-x-2 px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-bold text-slate-900 dark:text-slate-100 hover:bg-slate-200 dark:hover:bg-slate-700 transition active:scale-95 border border-slate-200 dark:border-slate-700/60">
                        <span id="current-passage-label">Choose a Book</span>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-brand-600 dark:text-brand-500"></i>
                    </button>
                </div>

                <div class="flex items-center space-x-2">
                    <div class="relative inline-block">
                        <select id="version-select" class="absolute inset-0 w-full h-full opacity-0 z-10 cursor-pointer">
                            <option value="CSB">Christian Standard Bible (CSB)</option>
                            <option value="ESV">English Standard Version (ESV)</option>
                            <option value="KJV">King James Version (KJV)</option>
                            <option value="NKJV">New King James Version (NKJV)</option>
                            <option value="NIV">New International Version (NIV)</option>
                            <option value="NASB">New American Standard Bible (NASB)</option>
                            <option value="ASV">American Standard Version (ASV)</option>
                            <option value="TLB">The Living Bible (TLB)</option>
                            <option value="NRSVUE">New Revised Standard Version (NRSVUE)</option>
                            <option value="LSV">Legacy Standard Version (LSV)</option>
                        </select>
                        <div id="version-display-pill" class="bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/60 rounded-xl text-xs font-bold px-3 py-1.5 text-slate-800 dark:text-slate-200 flex items-center space-x-1.5 pointer-events-none">
                            <span id="version-selected-abbr">CSB</span>
                            <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400"></i>
                        </div>
                    </div>

                    <button id="btn-toggle-settings" class="p-1.5 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/60 transition">
                        <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- SETTINGS PANEL -->
            <div id="settings-panel" class="hidden px-5 py-4 bg-slate-50 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 text-sm space-y-4">
                <div class="flex items-center justify-between">
                    <span class="font-medium text-slate-700 dark:text-slate-300">Words of Jesus in Red</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle-red-letter" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-slate-300 dark:bg-slate-750 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-600"></div>
                    </label>
                </div>

                <div class="flex items-center justify-between">
                    <span class="font-medium text-slate-700 dark:text-slate-300">Theme</span>
                    <div class="flex bg-slate-200 dark:bg-slate-800 rounded-xl p-1 space-x-1 border border-slate-300 dark:border-slate-700/60">
                        <button data-theme="system" class="btn-theme px-3 py-1 rounded-lg text-xs font-semibold transition text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">System</button>
                        <button data-theme="light" class="btn-theme px-3 py-1 rounded-lg text-xs font-semibold transition text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">Light</button>
                        <button data-theme="sepia" class="btn-theme px-3 py-1 rounded-lg text-xs font-semibold transition text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">Sepia</button>
                        <button data-theme="dark" class="btn-theme px-3 py-1 rounded-lg text-xs font-semibold transition text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">Dark</button>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <span class="font-medium text-slate-700 dark:text-slate-300">Text Size</span>
                    <div class="flex items-center space-x-2">
                        <button id="btn-font-dec" class="w-8 h-8 bg-white dark:bg-slate-800 rounded-lg border border-slate-300 dark:border-slate-700 font-bold flex items-center justify-center text-slate-700 dark:text-slate-200 shadow-sm">-</button>
                        <span id="font-size-label" class="text-xs font-semibold w-9 text-center text-slate-700 dark:text-slate-200">22px</span>
                        <button id="btn-font-inc" class="w-8 h-8 bg-white dark:bg-slate-800 rounded-lg border border-slate-300 dark:border-slate-700 font-bold flex items-center justify-center text-slate-700 dark:text-slate-200 shadow-sm">+</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN READER CONTAINER -->
        <main id="reader-container" class="hidden flex-1 overflow-y-auto px-5 py-5 pb-28 no-scrollbar smooth-scroll relative bg-white dark:bg-slate-950 selectable-text page-flip-container">
            <div id="return-crossref-banner" class="fixed top-16 left-1/2 -translate-x-1/2 z-40 hidden">
                <button id="btn-return-crossref" class="px-4 py-2 bg-brand-600 text-white backdrop-blur-md rounded-full text-xs font-bold shadow-xl border border-brand-400/40 flex items-center space-x-1.5 active:scale-95 transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span id="return-crossref-label">Back to John 3:16</span>
                </button>
            </div>

            <div id="loading-spinner" class="hidden flex justify-center py-16">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600 dark:border-brand-500"></div>
            </div>
            
            <div id="chapter-content" class="space-y-4 leading-relaxed font-scripture text-xl text-slate-900 dark:text-slate-100">
                <!-- Scripture content dynamically injected here -->
            </div>
        </main>

        <!-- DYNAMIC OVERLAY CONTAINER FOR TAB VIEWS -->
        <div id="view-overlay" class="flex-1 overflow-y-auto p-4 pb-20 smooth-scroll bg-slate-50 dark:bg-slate-950 z-20">
            <!-- HOME TAB CONTENT -->
            <div id="tab-content-home" class="tab-view space-y-5">
                <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-brand-700 via-brand-600 to-brand-900 p-6 text-white shadow-xl border border-brand-500/30 space-y-4">
                    <div class="absolute -right-4 -bottom-4 w-32 h-32 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
                    
                    <div class="flex justify-between items-center">
                        <span class="px-3 py-1 bg-white/15 backdrop-blur-md rounded-full text-[10px] font-bold uppercase tracking-wider text-brand-100 border border-white/10 flex items-center space-x-1">
                            <i data-lucide="sparkles" class="w-3 h-3 text-amber-300"></i>
                            <span>Verse of the Day</span>
                        </span>
                        <button id="btn-refresh-votd" class="p-1.5 bg-white/10 hover:bg-white/20 text-white rounded-xl transition active:scale-95" title="Get New Random Verse">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <p id="votd-text" class="font-scripture text-xl leading-relaxed text-slate-100 font-medium selectable-text">
                        Loading daily scripture...
                    </p>

                    <div class="flex justify-between items-center pt-3 border-t border-white/20">
                        <span id="votd-ref" class="font-bold text-sm text-brand-100">John 3:16</span>
                        <button id="btn-read-context" class="px-4 py-2 bg-white text-brand-900 rounded-xl text-xs font-bold shadow-md hover:bg-brand-50 active:scale-95 transition flex items-center space-x-1.5">
                            <span>Read Explanation</span>
                            <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>

                <!-- RELIGIOUS IMAGERY FILLER BANNER -->
                <div class="relative overflow-hidden rounded-3xl h-64 shadow-lg border border-slate-200 dark:border-slate-800/80 group">
                    <img src="https://images.unsplash.com/photo-1544427920-c49ccfb85579?q=80&w=1000&auto=format&fit=crop" 
                         alt="Three Crosses Silhouette at Sunset" 
                         class="absolute inset-0 w-full h-full object-cover object-center transform group-hover:scale-105 transition duration-700 ease-out">
                    
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/85 via-slate-950/30 to-transparent"></div>

                    <div class="absolute bottom-0 left-0 right-0 p-5 space-y-1 text-white">
                        <p class="font-scripture italic text-base leading-snug text-slate-100 drop-shadow-md">
                            "He is not here; for He is risen, as He said."
                        </p>
                        <span class="text-xs font-bold tracking-wider text-amber-300/90 uppercase block">
                            Matthew 28:6
                        </span>
                    </div>
                </div>
            </div>

            <!-- Cross Reference Tab -->
            <div id="tab-content-crossref" class="tab-view hidden space-y-4">
                <h2 class="text-base font-bold text-slate-900 dark:text-slate-100">Thematic Cross-Reference</h2>
                <div id="crossref-source-box" class="p-3.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl text-xs space-y-1 hidden shadow-sm">
                    <span class="font-bold text-brand-600 dark:text-brand-400" id="crossref-source-ref">John 3:16</span>
                    <p class="font-scripture text-base italic text-slate-800 dark:text-slate-200 selectable-text" id="crossref-source-text"></p>
                </div>
                <div class="flex space-x-2">
                    <input type="text" id="crossref-input" placeholder="Topic or phrase..." class="flex-1 px-3.5 py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-xs text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-600 selectable-text">
                    <button id="btn-trigger-crossref" class="px-4 py-2.5 bg-brand-600 text-white rounded-xl text-xs font-bold active:scale-95 transition">Find</button>
                </div>
                <div id="crossref-results-container" class="space-y-3 pt-1"></div>
            </div>

            <!-- Saved Tab Content -->
            <div id="tab-content-saved" class="tab-view hidden space-y-4">
                <h2 class="text-base font-bold text-slate-900 dark:text-slate-100">Bookmarks & Highlights</h2>
                <div class="flex space-x-3 border-b border-slate-200 dark:border-slate-800 pb-2">
                    <button id="subtab-highlights" class="font-bold text-xs text-brand-600 dark:text-brand-400 border-b-2 border-brand-600 dark:border-brand-500 pb-1">Highlights</button>
                    <button id="subtab-bookmarks" class="font-bold text-xs text-slate-400 dark:text-slate-500 pb-1">Bookmarks</button>
                </div>
                <div id="saved-list-container" class="space-y-3"></div>
            </div>
        </div>

        <!-- STREAMLINED MULTI-VERSE ACTION DOCK (FLOATING IN LOWER-MIDDLE AREA) -->
        <div id="multi-verse-dock" class="fixed left-4 right-4 z-40 hidden transition-all transform animate-fade-in">
            <div class="bg-slate-900/95 backdrop-blur-xl text-white px-3.5 py-3 rounded-2xl shadow-2xl border border-slate-700/80 flex items-center justify-between space-x-2">
                <div class="flex items-center space-x-2 flex-shrink-0">
                    <div class="w-7 h-7 rounded-full bg-brand-600 flex items-center justify-center text-xs font-bold shadow-md text-white" id="selected-count-badge">0</div>
                    <button id="btn-what-does-this-mean" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold rounded-xl shadow-md flex items-center space-x-1.5 active:scale-95 transition" title="What Does This Mean?">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-300"></i>
                        <span>What's this mean?</span>
                    </button>
                </div>

                <div class="flex items-center space-x-1.5 bg-slate-800/80 p-1.5 rounded-xl border border-slate-700/80 flex-shrink-0">
                    <button data-color="yellow" class="dock-hl-color w-6 h-6 rounded-full bg-yellow-400 active:scale-95 transition shadow-sm" title="Yellow"></button>
                    <button data-color="green"  class="dock-hl-color w-6 h-6 rounded-full bg-emerald-400 active:scale-95 transition shadow-sm" title="Green"></button>
                    <button data-color="blue"   class="dock-hl-color w-6 h-6 rounded-full bg-sky-400 active:scale-95 transition shadow-sm" title="Blue"></button>
                    <button data-color="pink"   class="dock-hl-color w-6 h-6 rounded-full bg-pink-400 active:scale-95 transition shadow-sm" title="Pink"></button>
                    <button data-color="clear"  class="dock-hl-color w-6 h-6 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-slate-300 shadow-sm" title="Clear">×</button>
                </div>

                <div class="flex items-center space-x-1 flex-shrink-0">
                    <button id="btn-clear-selection" class="p-2 text-slate-400 hover:text-white rounded-xl bg-slate-800 border border-slate-700 transition active:scale-95" title="Clear">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- FLOATING CHAPTER NAVIGATION -->
        <div id="floating-chap-nav" class="fixed right-5 flex space-x-2 z-20 hidden">
            <button id="btn-prev-chap" class="p-3 bg-white/90 dark:bg-slate-800/90 backdrop-blur-lg shadow-xl border border-slate-200 dark:border-slate-700/80 rounded-2xl text-slate-800 dark:text-slate-100 active:scale-95 transition">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <button id="btn-next-chap" class="p-3 bg-white/90 dark:bg-slate-800/90 backdrop-blur-lg shadow-xl border border-slate-200 dark:border-slate-700/80 rounded-2xl text-slate-800 dark:text-slate-100 active:scale-95 transition">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- BOTTOM NAV BAR WITH SAFE-AREA PADDING -->
        <nav class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 grid grid-cols-4 py-2 z-30 shadow-2xl nav-safe">
            <button data-tab="home" class="nav-tab flex flex-col items-center justify-center py-1 px-1 rounded-xl transition active:scale-95 text-brand-600 dark:text-brand-400 font-bold">
                <i data-lucide="sparkles" class="w-5 h-5 mb-0.5"></i>
                <span class="text-[11px] font-semibold tracking-tight">Today</span>
            </button>
            <button data-tab="reader" class="nav-tab flex flex-col items-center justify-center py-1 px-1 rounded-xl transition active:scale-95 text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400">
                <i data-lucide="book-open" class="w-5 h-5 mb-0.5"></i>

    <!-- SCRIPT APPLICATION LOGIC -->
    <script>
        function detectIOSAddressBar() {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const htmlEl = document.documentElement;

            if (isIOS) {
                const windowHeight = window.innerHeight;
                const visualHeight = window.visualViewport ? window.visualViewport.height : windowHeight;
                
                const div = document.createElement('div');
                div.style.paddingBottom = 'env(safe-area-inset-bottom, 0px)';
                div.style.position = 'fixed';
                div.style.bottom = '0';
                div.style.visibility = 'hidden';
                document.body.appendChild(div);
                const insetBottomPx = parseFloat(window.getComputedStyle(div).paddingBottom) || 0;
                document.body.removeChild(div);

                if (insetBottomPx > 15 || (windowHeight - visualHeight) > 20) {
                    htmlEl.classList.add('safari-bar-bottom');
                    htmlEl.classList.remove('safari-bar-top');
                    document.documentElement.style.setProperty('--ios-bottom-offset', `${Math.max(insetBottomPx, 20)}px`);
                } else {
                    htmlEl.classList.add('safari-bar-top');
                    htmlEl.classList.remove('safari-bar-bottom');
                    document.documentElement.style.setProperty('--ios-bottom-offset', '0px');
                }
            } else {
                htmlEl.classList.remove('safari-bar-bottom', 'safari-bar-top');
                document.documentElement.style.setProperty('--ios-bottom-offset', '0px');
            }
        }

        window.addEventListener('resize', detectIOSAddressBar);
        window.addEventListener('orientationchange', detectIOSAddressBar);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', detectIOSAddressBar);
            window.visualViewport.addEventListener('scroll', detectIOSAddressBar);
        }

        function triggerHaptic() {
            if ('vibrate' in navigator) {
                try { navigator.vibrate(12); } catch (e) {}
            }
        }

        function setAppHeight() {
            const doc = document.documentElement;
            doc.style.setProperty('--app-height', `${window.innerHeight}px`);
        }
        window.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', setAppHeight);
        setAppHeight();

        const BIBLE_BOOKS = [
            { name: "Genesis", testament: "OT", chapters: 50 },

            { name: "Leviticus", testament: "OT", chapters: 27 },

            { name: "Judges", testament: "OT", chapters: 21 },

            { name: "1 Samuel", testament: "OT", chapters: 31 },
            { name: "2 Samuel", testament: "OT", chapters: 24 },
            { name: "1 Kings", testament: "OT", chapters: 22 },
            { name: "2 Kings", testament: "OT", chapters: 25 },
            { name: "1 Chronicles", testament: "OT", chapters: 29 },
            { name: "2 Chronicles", testament: "OT", chapters: 36 },
            { name: "Ezra", testament: "OT", chapters: 10 },
            { name: "Nehemiah", testament: "OT", chapters: 13 },
            { name: "Esther", testament: "OT", chapters: 10 },
            { name: "Job", testament: "OT", chapters: 42 },
            { name: "Psalms", testament: "OT", chapters: 150 },
            { name: "Proverbs", testament: "OT", chapters: 31 },
            { name: "Ecclesiastes", testament: "OT", chapters: 12 },
            { name: "Song of Solomon", testament: "OT", chapters: 8 },
            { name: "Isaiah", testament: "OT", chapters: 66 },
            { name: "Jeremiah", testament: "OT", chapters: 52 },
            { name: "Lamentations", testament: "OT", chapters: 5 },
            { name: "Ezekiel", testament: "OT", chapters: 48 },
            { name: "Daniel", testament: "OT", chapters: 12 },
            { name: "Hosea", testament: "OT", chapters: 14 },
            { name: "Joel", testament: "OT", chapters: 3 },
            { name: "Amos", testament: "OT", chapters: 9 },
            { name: "Obadiah", testament: "OT", chapters: 1 },
            { name: "Jonah", testament: "OT", chapters: 4 },
            { name: "Micah", testament: "OT", chapters: 7 },
            { name: "Nahum", testament: "OT", chapters: 3 },
            { name: "Habakkuk", testament: "OT", chapters: 3 },
            { name: "Zephaniah", testament: "OT", chapters: 3 },
            { name: "Haggai", testament: "OT", chapters: 2 },
            { name: "Zechariah", testament: "OT", chapters: 14 },

            { name: "John", testament: "NT", chapters: 21 },
            { name: "Acts", testament: "NT", chapters: 28 },
            { name: "Romans", testament: "NT", chapters: 16 },
            { name: "1 Corinthians", testament: "NT", chapters: 16 },
            { name: "2 Corinthians", testament: "NT", chapters: 13 },
            { name: "Galatians", testament: "NT", chapters: 6 },
            { name: "Ephesians", testament: "NT", chapters: 6 },
            { name: "Philippians", testament: "NT", chapters: 4 },
            { name: "Colossians", testament: "NT", chapters: 4 },
            { name: "1 Thessalonians", testament: "NT", chapters: 5 },
            { name: "2 Thessalonians", testament: "NT", chapters: 3 },
            { name: "1 Timothy", testament: "NT", chapters: 6 },
            { name: "2 Timothy", testament: "NT", chapters: 4 },
            { name: "Titus", testament: "NT", chapters: 3 },
            { name: "Philemon", testament: "NT", chapters: 1 },
            { name: "Hebrews", testament: "NT", chapters: 13 },
            { name: "James", testament: "NT", chapters: 5 },
            { name: "1 Peter", testament: "NT", chapters: 5 },
            { name: "2 Peter", testament: "NT", chapters: 3 },
            { name: "1 John", testament: "NT", chapters: 5 },
            { name: "2 John", testament: "NT", chapters: 1 },
            { name: "3 John", testament: "NT", chapters: 1 },
            { name: "Jude", testament: "NT", chapters: 1 },
            { name: "Revelation", testament: "NT", chapters: 22 }
        ];

        // VERSES WITH SIMPLE EXPLANATIONS
        const POPULAR_VERSES = [
            { book: "John", chapter: 3, verse: 16, ref: "John 3:16", context: "God loves every single person in the world so much that He gave His Son to help us. When we trust Him, we never have to feel lost or alone, and we get to share in His love forever." },
            { book: "Philippians", chapter: 4, verse: 6, ref: "Philippians 4:6", context: "Instead of letting worry fill your mind, turn those big feelings into simple prayers. Talk to God like a best friend and remember to thank Him for all the good things He does." },
            { book: "Philippians", chapter: 4, verse: 13, ref: "Philippians 4:13", context: "You don't have to carry hard tasks all by yourself. God gives you energy and inner courage so you can get through whatever challenge comes your way." },
            { book: "Psalms", chapter: 23, verse: 1, ref: "Psalms 23:1", context: "Think of God like a gentle shepherd taking care of little sheep. He watches over you every step of the day and makes sure you have everything you truly need." },
            { book: "Proverbs", chapter: 3, verse: 5, ref: "Proverbs 3:5", context: "Sometimes things happen that don't make sense right away. Instead of trying to figure everything out on your own, trust that God sees the bigger picture." },
            { book: "Romans", chapter: 8, verse: 28, ref: "Romans 8:28", context: "Even when a day feels messy or hard, God can take all those broken pieces and turn them into something beautiful and good for your life." },
            { book: "Isaiah", chapter: 40, verse: 31, ref: "Isaiah 40:31", context: "When you feel super tired or worn out, take time to rest with God. He fills your heart back up with fresh strength so you can soar high again." },
            { book: "Jeremiah", chapter: 29, verse: 11, ref: "Jeremiah 29:11", context: "God has wonderful plans for your life. He wants to bring you safety, joy, and a bright future full of hope." },
            { book: "Joshua", chapter: 1, verse: 9, ref: "Joshua 1:9", context: "You never have to be scared when trying something new or difficult. God is right beside you everywhere you go, giving you bravery." }
        ];

        const versionMap = { 'KJV': 'kjv', 'NKJV': 'kjv', 'ASV': 'asv', 'ESV': 'web', 'CSB': 'web', 'NIV': 'web', 'NASB': 'asv', 'TLB': 'web', 'NRSVUE': 'web', 'LSV': 'asv' };

        const state = {
            activeTab: 'home',
            version: localStorage.getItem('pb_version') || 'CSB',
            book: null,
            chapter: null,
            redLetter: true,
            theme: localStorage.getItem('pb_theme') || 'system',
            fontSize: 22,
            selectedTestament: 'OT',
            selectedVerses: [],
            currentVotd: JSON.parse(localStorage.getItem('pb_votd') || 'null'),
            highlights: JSON.parse(localStorage.getItem('pb_highlights') || '{}'),
            bookmarks: JSON.parse(localStorage.getItem('pb_bookmarks') || '[]')
        };

        const labelPassage = document.getElementById('current-passage-label');
        const chapterContent = document.getElementById('chapter-content');
        const spinner = document.getElementById('loading-spinner');
        const settingsPanel = document.getElementById('settings-panel');
        const modalPicker = document.getElementById('modal-picker');
        const modalVotdContext = document.getElementById('modal-votd-context');
        const multiVerseDock = document.getElementById('multi-verse-dock');
        const pickerBooks = document.getElementById('picker-books');
        const pickerChapters = document.getElementById('picker-chapters');
        const viewOverlay = document.getElementById('view-overlay');
        const floatingChapNav = document.getElementById('floating-chap-nav');
        const readerContainer = document.getElementById('reader-container');

        function getShownVerseHistory() { return JSON.parse(localStorage.getItem('pb_shown_verses') || '[]'); }

        function getNonRepeatingVerse() {
            let history = getShownVerseHistory();
            let unshownVerses = POPULAR_VERSES.filter(v => !history.includes(v.ref));
            
            if (unshownVerses.length === 0) {
                history = [];
                unshownVerses = [...POPULAR_VERSES];
            }
            
            const selectedVerse = unshownVerses[Math.floor(Math.random() * unshownVerses.length)];
            history.push(selectedVerse.ref);
            localStorage.setItem('pb_shown_verses', JSON.stringify(history));
            return selectedVerse;
        }

        async function fetchSingleVerseText(book, chapter, verse) {
            try {
                const apiVersion = versionMap[state.version] || 'web';
                const res = await fetch(`https://bible-api.com/${encodeURIComponent(book + ' ' + chapter + ':' + verse)}?translation=${apiVersion}`);
                const data = await res.json();
                if (data && data.text) return data.text.trim();
            } catch (e) {}
            return "For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.";
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            applyTheme(state.theme);
            detectIOSAddressBar();
            
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (state.theme === 'system') applyTheme('system');
            });

            const versionSelect = document.getElementById('version-select');
            const versionAbbrPill = document.getElementById('version-selected-abbr');
            if (versionSelect) versionSelect.value = state.version;
            if (versionAbbrPill) versionAbbrPill.textContent = state.version;

            initializeDailyVotd();
            setupEventListeners();
            setupTouchSwipeGestures();
            handleTabSwitch('home');
        });

        async function initializeDailyVotd() {
            const today = new Date().toDateString();
            if (state.currentVotd && state.currentVotd.date === today) {
                await updateVotdCard(state.currentVotd);
            } else {
                await refreshVotd();
            }
        }

        async function refreshVotd() {
            const today = new Date().toDateString();
            const freshRef = getNonRepeatingVerse();
            await updateVotdCard({ date: today, ...freshRef });
        }

        async function updateVotdCard(votdObj) {
            state.currentVotd = votdObj;
            localStorage.setItem('pb_votd', JSON.stringify(votdObj));
            document.getElementById('votd-ref').textContent = votdObj.ref;
            
            const text = await fetchSingleVerseText(votdObj.book, votdObj.chapter, votdObj.verse);
            document.getElementById('votd-text').textContent = `"${text}"`;
        }

        function showExplanationModal(refStr, textStr, contextStr) {
            document.getElementById('context-modal-ref').textContent = refStr || (state.currentVotd ? state.currentVotd.ref : 'Verse Explanation');
            document.getElementById('context-modal-verse').textContent = textStr || (document.getElementById('votd-text').textContent);
            document.getElementById('context-background-text').textContent = contextStr || (state.currentVotd ? state.currentVotd.context : "This scripture offers simple wisdom, comfort, and encouragement for everyday life.");
            
            modalVotdContext.classList.remove('hidden');
        }

        async function fetchChapterText(book, chapter, version) {
            try {
                spinner.classList.remove('hidden');
                chapterContent.innerHTML = '';
                const singleChapterRanges = { "Obadiah": "1:1-21", "Philemon": "1:1-25", "2 John": "1:1-13", "3 John": "1:1-14", "Jude": "1:1-25" };
                let query = singleChapterRanges[book] ? `${book} ${singleChapterRanges[book]}` : `${book} ${chapter}`;
                const apiVersion = versionMap[version] || 'kjv';
                const res = await fetch(`https://bible-api.com/${encodeURIComponent(query)}?translation=${apiVersion}`);
                const data = await res.json();
                spinner.classList.add('hidden');
                return data && data.verses ? data.verses : getFallbackVerseData(book, chapter);
            } catch (err) {
                spinner.classList.add('hidden');
                return getFallbackVerseData(book, chapter);
            }
        }

        function getFallbackVerseData(book, chapter) {
            const isNT = BIBLE_BOOKS.find(b => b.name === book)?.testament === 'NT';
            return [
                { verse: 1, text: "For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.", jesus: isNT && (book === 'John' || book === 'Matthew' || book === 'Mark' || book === 'Luke') }
            ];
        }

        async function renderPassage() {
            if (!state.book || !state.chapter) return;
            labelPassage.textContent = `${state.book} ${state.chapter}`;
            const verses = await fetchChapterText(state.book, state.chapter, state.version);
            
            chapterContent.innerHTML = '';
            verses.forEach(v => {
                const verseKey = `${state.book}_${state.chapter}_${v.verse}`;
                const highlightColor = state.highlights[verseKey] || '';

                const p = document.createElement('p');
                p.id = `verse-${v.verse}`;
                p.className = `verse-item inline-block w-full py-1.5 px-2 rounded-xl transition cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/60 ${highlightColor ? 'hl-' + highlightColor : ''}`;
                p.style.fontSize = `${state.fontSize}px`;

                const vNum = document.createElement('span');
                vNum.className = 'font-sans text-[12px] font-bold text-brand-600 dark:text-brand-400 mr-2 select-none align-super';
                vNum.textContent = v.verse;

                const vText = document.createElement('span');
                if (state.redLetter && v.jesus) vText.className = 'red-letter';
                vText.textContent = v.text + ' ';

                p.appendChild(vNum);
                p.appendChild(vText);
                p.addEventListener('click', () => {
                    triggerHaptic();
                    toggleVerseSelection(v.verse, v.text, p);
                });
                chapterContent.appendChild(p);
            });
        }

        function toggleVerseSelection(verseNum, text, element) {
            const existingIndex = state.selectedVerses.findIndex(v => v.verse === verseNum && v.book === state.book && v.chapter === state.chapter);
            const activeClasses = ['ring-2', 'ring-brand-600', 'dark:ring-brand-400', 'bg-indigo-50', 'dark:bg-indigo-950/60'];

            if (existingIndex > -1) {
                state.selectedVerses.splice(existingIndex, 1);
                element.classList.remove(...activeClasses);
            } else {
                state.selectedVerses.push({ book: state.book, chapter: state.chapter, verse: verseNum, text: text, version: state.version });
                element.classList.add(...activeClasses);
            }
            updateMultiVerseDock();
        }

        function updateMultiVerseDock() {
            const count = state.selectedVerses.length;
            if (count > 0 && state.activeTab === 'reader') {
                multiVerseDock.classList.remove('hidden');
                document.getElementById('selected-count-badge').textContent = count;
            } else {
                multiVerseDock.classList.add('hidden');
            }
        }

        function clearVerseSelections() {
            triggerHaptic();
            state.selectedVerses = [];
            const activeClasses = ['ring-2', 'ring-brand-600', 'dark:ring-brand-400', 'bg-indigo-50', 'dark:bg-indigo-950/60'];
            document.querySelectorAll('.verse-item').forEach(el => el.classList.remove(...activeClasses));
            multiVerseDock.classList.add('hidden');
        }

        function applyHighlightToSelected(color) {
            triggerHaptic();
            state.selectedVerses.forEach(v => {
                const key = `${v.book}_${v.chapter}_${v.verse}`;
                if (color === 'clear') {
                    delete state.highlights[key];
                } else {
                    state.highlights[key] = color;
                }
            });
            localStorage.setItem('pb_highlights', JSON.stringify(state.highlights));
            renderPassage();
            clearVerseSelections();
        }

        function setupEventListeners() {
            document.getElementById('btn-refresh-votd').addEventListener('click', async () => {
                triggerHaptic();
                await refreshVotd();
            });

            document.getElementById('btn-read-context').addEventListener('click', () => {
                triggerHaptic();
                showExplanationModal();
            });

            document.getElementById('btn-what-does-this-mean').addEventListener('click', () => {
                triggerHaptic();
                if (state.selectedVerses.length === 0) return;
                
                const sorted = [...state.selectedVerses].sort((a, b) => a.verse - b.verse);
                const book = sorted[0].book;
                const chap = sorted[0].chapter;
                const vNums = sorted.map(v => v.verse).join(',');
                const refStr = `${book} ${chap}:${vNums}`;
                const combinedText = sorted.map(v => `${v.verse}. ${v.text.trim()}`).join(' ');
                
                const explanation = "This scripture reminds us that God is actively caring for us in everyday moments. It calls us to rest in His kindness, act with compassion toward others, and trust His steady hand when facing difficulties.";
                
                showExplanationModal(refStr, combinedText, explanation);
            });

            document.querySelectorAll('.dock-hl-color').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const color = e.currentTarget.dataset.color;
                    applyHighlightToSelected(color);
                });
            });

            document.getElementById('btn-close-context').addEventListener('click', () => {
                triggerHaptic();
                modalVotdContext.classList.add('hidden');
            });

            document.getElementById('btn-context-dismiss').addEventListener('click', () => {
                triggerHaptic();
                modalVotdContext.classList.add('hidden');
            });

            document.getElementById('btn-context-jump-reader').addEventListener('click', () => {
                triggerHaptic();
                modalVotdContext.classList.add('hidden');
                if (state.selectedVerses.length > 0) {
                    const first = state.selectedVerses[0];
                    state.book = first.book;
                    state.chapter = first.chapter;
                } else if (state.currentVotd) {
                    state.book = state.currentVotd.book;
                    state.chapter = state.currentVotd.chapter;
                }
                renderPassage();
                handleTabSwitch('reader');
            });

            document.getElementById('version-select').addEventListener('change', async (e) => {
                triggerHaptic();
                state.version = e.target.value;
                localStorage.setItem('pb_version', e.target.value);
                document.getElementById('version-selected-abbr').textContent = e.target.value;
                if (state.currentVotd) await updateVotdCard(state.currentVotd);
                if (state.book) renderPassage();
            });

            document.getElementById('btn-toggle-settings').addEventListener('click', () => {
                triggerHaptic();
                settingsPanel.classList.toggle('hidden');
            });

            document.getElementById('toggle-red-letter').addEventListener('change', (e) => {
                triggerHaptic();
                state.redLetter = e.target.checked;
                if (state.book) renderPassage();
            });

            document.querySelectorAll('.btn-theme').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    triggerHaptic();
                    applyTheme(e.target.dataset.theme);
                });
            });

            document.getElementById('btn-font-inc').addEventListener('click', () => {
                triggerHaptic();
                if (state.fontSize < 32) {
                    state.fontSize += 1;
                    document.getElementById('font-size-label').textContent = `${state.fontSize}px`;
                    if (state.book) renderPassage();
                }
            });
            document.getElementById('btn-font-dec').addEventListener('click', () => {
                triggerHaptic();
                if (state.fontSize > 15) {
                    state.fontSize -= 1;
                    document.getElementById('font-size-label').textContent = `${state.fontSize}px`;
                    if (state.book) renderPassage();
                }
            });

            document.getElementById('btn-nav-picker').addEventListener('click', () => { triggerHaptic(); openPicker(); });
            document.getElementById('btn-close-picker').addEventListener('click', () => { triggerHaptic(); modalPicker.classList.add('hidden'); });

            document.getElementById('tab-ot').addEventListener('click', () => { triggerHaptic(); switchTestament('OT'); });
            document.getElementById('tab-nt').addEventListener('click', () => { triggerHaptic(); switchTestament('NT'); });

            document.getElementById('btn-prev-chap').addEventListener('click', () => { triggerHaptic(); navigateChapter(-1); });
            document.getElementById('btn-next-chap').addEventListener('click', () => { triggerHaptic(); navigateChapter(1); });

            document.getElementById('btn-clear-selection').addEventListener('click', clearVerseSelections);

            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    triggerHaptic();
                    handleTabSwitch(e.currentTarget.dataset.tab);
                });
            });
        }

        function applyTheme(theme) {
            state.theme = theme;
            localStorage.setItem('pb_theme', theme);
            document.body.classList.remove('dark', 'sepia');

            if (theme === 'system') {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } else if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else if (theme === 'sepia') {
                document.body.classList.add('sepia');
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function openPicker() {
            modalPicker.classList.remove('hidden');
            pickerBooks.classList.remove('hidden');
            pickerChapters.classList.add('hidden');
            switchTestament('OT');
        }

        function switchTestament(testament) {
            state.selectedTestament = testament;
            document.getElementById('tab-ot').className = testament === 'OT' ? 'px-4 py-2 text-sm font-bold border-b-2 border-brand-600 dark:border-brand-500 text-brand-600 dark:text-brand-400' : 'px-4 py-2 text-sm font-bold text-slate-400';
            document.getElementById('tab-nt').className = testament === 'NT' ? 'px-4 py-2 text-sm font-bold border-b-2 border-brand-600 dark:border-brand-500 text-brand-600 dark:text-brand-400' : 'px-4 py-2 text-sm font-bold text-slate-400';
            renderPickerBooks();
        }

        function renderPickerBooks() {
            pickerBooks.innerHTML = '';
            const filtered = BIBLE_BOOKS.filter(b => b.testament === state.selectedTestament);
            filtered.forEach(b => {
                const btn = document.createElement('button');
                btn.className = 'p-3 text-left text-xs font-semibold rounded-xl bg-slate-100 dark:bg-slate-800/80 text-slate-800 dark:text-slate-200 hover:bg-brand-600 hover:text-white border border-slate-200 dark:border-slate-700/60 transition';
                btn.textContent = b.name;
                btn.addEventListener('click', () => { triggerHaptic(); renderPickerChapters(b); });
                pickerBooks.appendChild(btn);
            });
        }

        function renderPickerChapters(bookObj) {
            pickerBooks.classList.add('hidden');
            pickerChapters.classList.remove('hidden');
            pickerChapters.innerHTML = '';

            for (let i = 1; i <= bookObj.chapters; i++) {
                const btn = document.createElement('button');
                btn.className = 'p-3 text-center text-xs font-bold rounded-xl bg-slate-100 dark:bg-slate-800/80 text-slate-800 dark:text-slate-200 hover:bg-brand-600 hover:text-white transition';
                btn.textContent = i;
                btn.addEventListener('click', () => {
                    triggerHaptic();
                    state.book = bookObj.name;
                    state.chapter = i;
                    modalPicker.classList.add('hidden');
                    clearVerseSelections();
                    renderPassage();
                    handleTabSwitch('reader');
                });
                pickerChapters.appendChild(btn);
            }
        }

        function navigateChapter(direction) {
            if (!state.book) { openPicker(); return; }
            const currentBookIndex = BIBLE_BOOKS.findIndex(b => b.name === state.book);
            const currentBookObj = BIBLE_BOOKS[currentBookIndex];

            const outAnimClass = direction === 1 ? 'animate-flip-next-out' : 'animate-flip-prev-out';
            const inAnimClass = direction === 1 ? 'animate-flip-next-in' : 'animate-flip-prev-in';

            chapterContent.classList.remove('animate-flip-next-out', 'animate-flip-next-in', 'animate-flip-prev-out', 'animate-flip-prev-in');
            chapterContent.classList.add(outAnimClass);

            setTimeout(async () => {
                if (direction === 1) {
                    if (state.chapter < currentBookObj.chapters) state.chapter++;
                    else if (currentBookIndex < BIBLE_BOOKS.length - 1) {
                        state.book = BIBLE_BOOKS[currentBookIndex + 1].name;
                        state.chapter = 1;
                    }
                } else {
                    if (state.chapter > 1) state.chapter--;
                    else if (currentBookIndex > 0) {
                        state.book = BIBLE_BOOKS[currentBookIndex - 1].name;
                        state.chapter = BIBLE_BOOKS[currentBookIndex - 1].chapters;
                    }
                }

                clearVerseSelections();
                await renderPassage();
                readerContainer.scrollTop = 0;
                chapterContent.classList.remove(outAnimClass);
                chapterContent.classList.add(inAnimClass);

                setTimeout(() => { chapterContent.classList.remove(inAnimClass); }, 220);
            }, 200);
        }

        function handleTabSwitch(tabName) {
            state.activeTab = tabName;
            document.querySelectorAll('.nav-tab').forEach(tab => {
                if (tab.dataset.tab === tabName) {
                    tab.className = "nav-tab flex flex-col items-center justify-center py-1 px-1 rounded-xl transition active:scale-95 text-brand-600 dark:text-brand-400 font-bold";
                } else {
                    tab.className = "nav-tab flex flex-col items-center justify-center py-1 px-1 rounded-xl transition active:scale-95 text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400";
                }
            });

            if (tabName === 'reader') {
                viewOverlay.classList.add('hidden');
                readerContainer.classList.remove('hidden');
                if (state.book) floatingChapNav.classList.remove('hidden');
                if (state.selectedVerses.length > 0) multiVerseDock.classList.remove('hidden');
                return;
            }

            readerContainer.classList.add('hidden');
            floatingChapNav.classList.add('hidden');
            multiVerseDock.classList.add('hidden');
            viewOverlay.classList.remove('hidden');
            document.querySelectorAll('.tab-view').forEach(v => v.classList.add('hidden'));
            document.getElementById(`tab-content-${tabName}`).classList.remove('hidden');
        }

        function setupTouchSwipeGestures() {
            let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;

            readerContainer.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            readerContainer.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                touchEndY = e.changedTouches[0].screenY;
                handleSwipeGesture();
            }, { passive: true });

            function handleSwipeGesture() {
                const diffX = touchEndX - touchStartX;
                const diffY = touchEndY - touchStartY;
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                    if (diffX < 0) {
                        triggerHaptic();
                        navigateChapter(1);
                    } else {
                        triggerHaptic();
                        navigateChapter(-1);
                    }
                }
            }
        }
    </script>

    <!-- Service Worker Registration with Cache Busting & Auto-Update Handler -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=14').then(reg => {
          reg.onupdatefound = () => {
            const installingWorker = reg.installing;
            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                window.location.reload();
              }
            };
          };
        });
      }
    </script>
</body>
